<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SpringBoot-Start Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
    <link rel="stylesheet" href="./css/styles.css">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-slate-950 text-slate-200">
    <div class="flex h-screen overflow-hidden relative">
        <!-- Sidebar -->
        <aside class="sidebar w-64 glass-effect border-r border-slate-800 flex-shrink-0 hidden md:flex flex-col z-20">
            <div class="p-6">
                <div class="flex items-center gap-2 text-indigo-400 font-bold text-xl">
                    <i data-lucide="rocket" class="w-8 h-8"></i>
                    <span class="gradient-text">SB-Start</span>
                </div>
            </div>
            <nav class="flex-1 px-4 space-y-1 overflow-y-auto">
                <a href="./index.html" class="sidebar-link active !text-indigo-400 !bg-indigo-500/10 border border-indigo-500/20">
                    <i data-lucide="layout-dashboard" class="w-5 h-5 mr-3"></i>
                    <span>控制面板</span>
                </a>
                <a href="./category.html" class="sidebar-link hover:bg-slate-800/50">
                    <i data-lucide="layers" class="w-5 h-5 mr-3"></i>
                    <span>分类管理</span>
                </a>
                <a href="./fileUpload.html" class="sidebar-link hover:bg-slate-800/50">
                    <i data-lucide="upload-cloud" class="w-5 h-5 mr-3"></i>
                    <span>文件上传</span>
                </a>
                <div class="pt-6 pb-2 text-xs font-semibold text-slate-500 uppercase tracking-wider px-4">
                    账户设置
                </div>
                <a href="./userInfo.html" class="sidebar-link hover:bg-slate-800/50">
                    <i data-lucide="user" class="w-5 h-5 mr-3"></i>
                    <span>个人信息</span>
                </a>
                <a href="./login.html" class="sidebar-link text-red-400 hover:bg-red-500/10 mt-4">
                    <i data-lucide="log-out" class="w-5 h-5 mr-3"></i>
                    <span>退出登录</span>
                </a>
            </nav>
        </aside>

        <!-- Main Content -->
        <main class="flex-1 flex flex-col min-w-0 overflow-hidden relative z-10">
            <!-- Header -->
            <header class="h-16 glass-effect border-b border-slate-800 flex items-center justify-between px-8 flex-shrink-0">
                <h2 class="text-lg font-semibold gradient-text">控制面板</h2>
                <div class="flex items-center gap-6">
                    <button class="p-2 text-slate-400 hover:text-indigo-400 transition-colors relative">
                        <i data-lucide="bell" class="w-5 h-5"></i>
                        <span class="absolute top-1 right-1 w-2 h-2 bg-indigo-500 rounded-full border-2 border-slate-900"></span>
                    </button>
                    <div class="flex items-center gap-3">
                        <div id="user-avatar" class="w-10 h-10 rounded-xl bg-indigo-500/10 flex items-center justify-center text-indigo-400 font-bold border border-indigo-500/20">
                            U
                        </div>
                    </div>
                </div>
            </header>

            <!-- Dashboard Content -->
            <div class="flex-1 overflow-y-auto p-8 tv-static-bg relative">
                <div class="animate__animated animate__fadeIn relative z-10">
                    <div class="grid grid-cols-1 md:grid-cols-3 gap-8 mb-8">
                        <!-- Stats Card 1 -->
                        <div class="galaxy-card group">
                            <div class="flex items-center justify-between mb-6">
                                <div class="p-4 bg-indigo-500/10 text-indigo-400 rounded-2xl border border-indigo-500/20 group-hover:scale-110 transition-transform">
                                    <i data-lucide="users" class="w-8 h-8"></i>
                                </div>
                                <span class="text-xs font-medium text-emerald-400 bg-emerald-400/10 border border-emerald-400/20 px-3 py-1 rounded-full">+12%</span>
                            </div>
                            <h3 class="text-slate-400 text-sm font-medium">总用户数</h3>
                            <p class="text-3xl font-bold text-white mt-2" id="stat-users">...</p>
                        </div>
                        <!-- Stats Card 2 -->
                        <div class="galaxy-card group">
                            <div class="flex items-center justify-between mb-6">
                                <div class="p-4 bg-purple-500/10 text-purple-400 rounded-2xl border border-purple-500/20 group-hover:scale-110 transition-transform">
                                    <i data-lucide="file-text" class="w-8 h-8"></i>
                                </div>
                                <span class="text-xs font-medium text-emerald-400 bg-emerald-400/10 border border-emerald-400/20 px-3 py-1 rounded-full">+5%</span>
                            </div>
                            <h3 class="text-slate-400 text-sm font-medium">分类总数</h3>
                            <p class="text-3xl font-bold text-white mt-2" id="stat-categories">...</p>
                        </div>
                        <!-- Stats Card 3 -->
                        <div class="galaxy-card group">
                            <div class="flex items-center justify-between mb-6">
                                <div class="p-4 bg-cyan-500/10 text-cyan-400 rounded-2xl border border-cyan-500/20 group-hover:scale-110 transition-transform">
                                    <i data-lucide="hard-drive" class="w-8 h-8"></i>
                                </div>
                                <span class="text-xs font-medium text-slate-400 bg-slate-400/10 border border-slate-400/20 px-3 py-1 rounded-full">稳定</span>
                            </div>
                            <h3 class="text-slate-400 text-sm font-medium">存储空间</h3>
                            <p class="text-3xl font-bold text-white mt-2">2.4 GB</p>
                        </div>
                    </div>

                    <!-- Welcome Section -->
                    <div class="gradient-bg rounded-3xl p-8 text-white relative overflow-hidden shadow-lg shadow-indigo-200">
                        <div class="relative z-10">
                            <h1 class="text-3xl font-bold mb-4">欢迎回来，<span id="welcome-username">用户</span>！</h1>
                            <p class="text-indigo-100 max-w-lg mb-6">
                                这是一个基于 Spring Boot 的现代化后端管理系统。在这里，您可以轻松管理分类、上传文件并查看实时数据分析。
                            </p>
                            <div class="flex gap-4">
                                <a href="./category.html" class="bg-white text-indigo-600 px-6 py-2 rounded-xl font-semibold hover:bg-indigo-50 transition-colors shadow-sm">
                                    开始管理
                                </a>
                                <button class="bg-indigo-500/30 text-white border border-white/30 px-6 py-2 rounded-xl font-semibold hover:bg-indigo-500/50 transition-colors">
                                    了解更多
                                </button>
                            </div>
                        </div>
                        <i data-lucide="sparkles" class="absolute right-12 top-1/2 -translate-y-1/2 w-48 h-48 text-white/10 rotate-12"></i>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="./js/utils.js"></script>
    <script src="./js/api.js"></script>
    <script>
        // 初始化图标
        initStarfield();
        lucide.createIcons();

        // 检查登录状态并加载数据
        document.addEventListener('DOMContentLoaded', async () => {
            const token = localStorage.getItem('token');
            if (!token) {
                window.location.href = './login.html';
                return;
            }

            try {
                // 加载用户信息
                const result = await userInfo();
                if (result.code === 0) {
                    const user = result.data;
                    document.getElementById('welcome-username').textContent = user.accountName;
                    document.getElementById('user-avatar').textContent = user.accountName.charAt(0).toUpperCase();
                }

                // 加载统计数据
                const categoriesResult = await getCategories();
                if (categoriesResult.code === 0) {
                    document.getElementById('stat-categories').textContent = categoriesResult.data.length;
                }
                
                // 模拟用户数（后端没有直接获取所有用户的接口，这里用1代指当前登录环境）
                document.getElementById('stat-users').textContent = '1';

            } catch (error) {
                console.error('加载数据失败:', error);
            }
        });
    </script>
</body>
</html>
